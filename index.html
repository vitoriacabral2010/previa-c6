<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévia C6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Identidade no espírito do C6 Bank: preto, branco e cinza, contraste alto.
   Verde só para "pago / no prazo"; âmbar = atrasado; vermelho = pendente. */
:root{
  --bg:#F3F3F3; --surface:#FFFFFF; --surface2:#EDEDED; --line:#DCDCDC;
  --ink:#0A0A0A; --muted:#6A6A6A; --faint:#9C9C9C;
  --accent:#0A0A0A; --accent-ink:#FFFFFF; --accent-soft:#E6E6E6;
  --top-bg:#0A0A0A; --top-ink:#FFFFFF; --top-muted:#A3A3A3; --top-line:#262626;
  --pos:#1B7F4E; --pos-soft:#DFF2E7;
  --warn:#9A6A00; --warn-soft:#FBEFC8;
  --bad:#C0392B; --bad-soft:#F9E0DC;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --r:12px;
  --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#161616; --surface2:#222222; --line:#2E2E2E;
    --ink:#F2F2F2; --muted:#A3A3A3; --faint:#6E6E6E;
    --accent:#F2F2F2; --accent-ink:#0A0A0A; --accent-soft:#2A2A2A;
    --top-bg:#000000; --top-ink:#FFFFFF; --top-muted:#8A8A8A; --top-line:#222222;
    --pos:#4FC98A; --pos-soft:#153524;
    --warn:#E3B341; --warn-soft:#3A2E10;
    --bad:#F0776B; --bad-soft:#3E1C18;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#161616; --surface2:#222222; --line:#2E2E2E;
  --ink:#F2F2F2; --muted:#A3A3A3; --faint:#6E6E6E;
  --accent:#F2F2F2; --accent-ink:#0A0A0A; --accent-soft:#2A2A2A;
  --top-bg:#000000; --top-ink:#FFFFFF; --top-muted:#8A8A8A; --top-line:#222222;
  --pos:#4FC98A; --pos-soft:#153524;
  --warn:#E3B341; --warn-soft:#3A2E10;
  --bad:#F0776B; --bad-soft:#3E1C18;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:22px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hide{display:none!important}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 26px;display:grid;gap:18px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.brand small{display:block;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);outline:none;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:10px;border:1px solid transparent;font-weight:600;background:var(--surface2);color:var(--ink);white-space:nowrap}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.demo-hint{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);display:grid;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.chip:hover{border-color:var(--accent)}
.err{color:var(--bad);font-size:13px}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .brand h1{font-size:17px}
.top .spacer{flex:1}
.status{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600}
.status.closed{background:var(--warn-soft);color:var(--warn)}
.status .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.25}
.who b{display:block;color:var(--ink);font-weight:600}
.tabs{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.main{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:grid;gap:16px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:4px}
.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.accent .v{color:var(--accent)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar input[type=date],.toolbar input[type=search]{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px;outline:none}
.toolbar input:focus{border-color:var(--accent)}

/* ---------- envio ---------- */
.slotpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2);text-align:left;display:grid;gap:2px}
.slot b{font-family:var(--display);font-size:14px}
.slot small{color:var(--muted);font-size:12px}
.slot.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.slot.done small.st{color:var(--accent);font-weight:600}
.slot.late small.st{color:var(--warn);font-weight:600}
.big{font-family:var(--display);font-size:26px!important;font-weight:600;padding:14px 16px!important}
.deadline{display:block;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13px;line-height:1.4}
.deadline.late{background:var(--warn-soft);color:var(--warn)}
.deadline.ok{background:var(--accent-soft);color:var(--accent)}
.mine{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.mine{grid-template-columns:1fr}.slotpick{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px}
.mini .v{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.miss{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.pill.pj{background:var(--surface2);color:var(--muted)}
.pill.int{background:var(--surface2);color:var(--ink)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);z-index:2}
th.r,td.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
td.name,th.name{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px}
th.name{background:var(--surface2);z-index:3}
tbody tr:hover td.name{background:var(--surface2)}
td.name b{font-weight:600}
td .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
td .val{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
td.miss .val{color:var(--bad)}
tr.pend td.name{box-shadow:inset 3px 0 0 var(--bad)}
tr.me td{background:var(--accent-soft)}
tfoot td{background:var(--surface2);font-weight:600;border-top:1px solid var(--line)}
.rank{width:24px;color:var(--faint);font-variant-numeric:tabular-nums}

/* ---------- chart ---------- */
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .vl{fill:var(--ink);font-size:11px;font-family:var(--display);font-weight:600}
.chart .bar-int{fill:var(--accent)}
.chart .bar-pj{fill:var(--accent);opacity:.45}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:5px;vertical-align:-1px}
.legend i.pj{opacity:.45}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:90px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.bar-track{height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:999px}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:500;box-shadow:var(--shadow);z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.list{display:grid;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.note{font-size:12.5px;color:var(--muted)}
.wa{white-space:pre-wrap;font-family:var(--body);font-size:13px;background:var(--surface2);padding:12px;border-radius:10px;max-height:260px;overflow:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- identidade C6: cabeçalho preto, estados semânticos ---------- */
.top{background:var(--top-bg);color:var(--top-ink);border-bottom:1px solid var(--top-line)}
.top .brand h1{color:var(--top-ink);letter-spacing:-.01em}
.top .mark{background:var(--top-ink);color:var(--top-bg)}
.top .who{color:var(--top-muted)} .top .who b{color:var(--top-ink)}
.top .btn.ghost{color:var(--top-ink);border-color:var(--top-line)}
.top .status{background:var(--top-line);color:var(--top-ink)} .top .status .dot{background:var(--pos)}
.top .status.closed{color:var(--warn)} .top .status.closed .dot{background:var(--warn)}
.tab{color:var(--top-muted)} .tab.on{color:var(--top-ink);border-bottom-color:var(--top-ink)}
.mark{border-radius:8px;letter-spacing:-.04em;font-size:15px}
.login-card .status{background:var(--pos-soft);color:var(--pos)} .login-card .status.closed{background:var(--warn-soft);color:var(--warn)}
.field input:focus,.field select:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.slot.on{border-color:var(--ink);background:var(--surface);box-shadow:0 0 0 2px var(--ink)}
.slot.done small.st{color:var(--pos)}
.deadline.ok{background:var(--pos-soft);color:var(--pos)}
.kpi.accent .v{color:var(--ink)}
.kpi{border:1px solid var(--line);box-shadow:none}
.card{border:1px solid var(--line);box-shadow:none}
.login-card{border:1px solid var(--line);box-shadow:var(--shadow)}
.chart .bar-int{fill:var(--ink)} .chart .bar-pj{fill:var(--ink);opacity:.35}
.legend i{background:var(--ink)} .legend i.pj{opacity:.35}
.bar-fill{background:var(--pos)}
tr.me td{background:var(--surface2)}
.seg button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.chip:hover{border-color:var(--ink)}
.toast{background:var(--ink);color:var(--bg)}
/* somatório */
.total-box{background:var(--surface);border:1px solid var(--line)}
.total-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;align-items:end}
@media(max-width:640px){.total-grid{grid-template-columns:1fr 1fr 1fr}}
.tv{font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.tv.accent{color:var(--pos)}
@media(max-width:640px){.tv{font-size:22px}}
.total-slots{margin-top:12px;border-top:1px solid var(--line)}
/* gerência */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.cmp{grid-template-columns:1fr}}
.cmp .box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.cmp .box .big{font-size:22px!important;padding:0!important}
.ritmo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ritmo .step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.ritmo .step .v{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.ritmo .step .d{font-size:12px;color:var(--muted)}
.attn td{color:var(--bad)}
/* celular: nada estoura a largura da tela; tabelas rolam dentro do próprio quadro */
html,body{max-width:100%;overflow-x:hidden}
.main>*,.grid2>*,.card,.section,.kpis>*{min-width:0}
.tablewrap{max-width:100%}
@media(max-width:640px){
  .top-in{gap:8px 12px} .top .brand h1{font-size:16px} .top .status{font-size:12px;padding:5px 10px} .who{font-size:12px}
  .toolbar{gap:8px} .toolbar input[type=date],.toolbar input[type=month],.toolbar input[type=search]{flex:1 1 140px;min-width:0}
  .seg{flex-wrap:wrap} .toolbar .btn{width:100%}
  .kpi .v{font-size:clamp(15px,5.4vw,20px);overflow-wrap:anywhere} .kpi{padding:12px} .card{padding:14px} .card-h{margin-bottom:8px}
  .ritmo{grid-template-columns:1fr}
  table{min-width:640px}
}
/* cartões no celular (tabelas largas viram cartões) */
.mcards{display:none}
.mcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:grid;gap:10px}
.mcard.pend{box-shadow:inset 3px 0 0 var(--bad)}
.mcard.me{background:var(--surface2)}
.mcard.dim{opacity:.55}
.mcard.total{background:var(--ink);color:var(--bg);border-color:var(--ink)} .mcard.total .mc-cs,.mcard.total .eyebrow{color:var(--bg);opacity:.8}
.mc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.mc-top b{font-weight:600}
.mc-tot{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.mc-v{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.mc-cs{font-size:12px;color:var(--muted);text-align:right;line-height:1.4} .mc-cs b{color:var(--ink);font-weight:600}
.mc-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mc-slot{border-radius:9px;padding:7px 8px;background:var(--surface2);display:grid;gap:2px;min-width:0}
.mc-slot.ok{background:var(--pos-soft)} .mc-slot.late{background:var(--warn-soft)} .mc-slot.miss{background:var(--bad-soft)}
.mc-sl{font-size:11px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:4px} .mc-slot.ok .mc-sl{color:var(--pos)} .mc-slot.late .mc-sl{color:var(--warn)} .mc-slot.miss .mc-sl{color:var(--bad)}
.mc-sl span{font-weight:500}
.mc-sv{font-family:var(--display);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-sc{font-size:11px;color:var(--muted)}
@media(max-width:640px){
  .mcards{display:grid;gap:10px}
  .tablewrap:has(+ .mcards){display:none}
  .mcards + .mcards{margin-top:0}
}
/* acessos */
.uform{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:820px){.uform{grid-template-columns:1fr 1fr}} @media(max-width:640px){.uform{grid-template-columns:1fr}}
.ulist{display:grid;gap:8px}
.urow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(200px,1fr) auto;gap:10px 16px;align-items:center}
@media(max-width:820px){.urow{grid-template-columns:1fr}}
.urow.dim{opacity:.55} .urow.me{background:var(--surface2)}
.uinfo{display:grid;gap:3px;font-size:14px} .uinfo b{font-weight:600} .uinfo .muted{font-size:12.5px}
.uctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.uctl select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;color:var(--ink)}
.uctl label{display:flex;align-items:center;gap:5px} .uctl .chk input{width:16px;height:16px}
.mcard.total .mc-cs b{color:var(--bg)}
/* entregas do dia (gerência) */
.entregas{border-width:2px;border-color:var(--ink)}
.ent-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.ent-grid{grid-template-columns:1fr}}
.ent{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;background:var(--surface)}
.ent.aberta{border-color:var(--pos);box-shadow:0 0 0 2px var(--pos-soft)}
.ent.vazia{opacity:.6}
.ent-h{display:flex;justify-content:space-between;align-items:center;gap:8px} .ent-h b{font-family:var(--display);font-size:16px}
.ent-v{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.1}
.ent-sub{font-size:13px;color:var(--muted);margin-bottom:4px}
.ent-linha{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-top:1px solid var(--line);padding-top:6px} .ent-linha span{color:var(--muted)} .ent-linha b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}

<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Prévia C6 — prévia diária de pagamentos da equipe de vendas
   Arquivo único, sem servidor. Os dados ficam no navegador (localStorage)
   nesta versão de demonstração. Para uso real com 43 pessoas, troque o
   objeto Store abaixo por chamadas ao Supabase (ver README.md).
   ===================================================================== */

const SLOTS = [
  { n:1, rotulo:'1ª prévia', limite:'10:40' },
  { n:2, rotulo:'2ª prévia', limite:'14:40' },
  { n:3, rotulo:'3ª prévia', limite:'17:10' },
];
const APP_VERSION = 'v2026-09-04.21';
const KEY = 'previa_c6_v2';

const Store = {
  load(){ try{ const s = localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return null; },
  save(db){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} },
  session(){ try{ return sessionStorage.getItem(KEY+'_user'); }catch(e){ return null; } },
  setSession(id){ try{ id ? sessionStorage.setItem(KEY+'_user', id) : sessionStorage.removeItem(KEY+'_user'); }catch(e){} },
};

/* ---------- utilidades ---------- */
const fmtBRL = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtMil = n => Math.abs(n||0)>=1000 ? (n/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil' : fmtBRL0(n);
const fmtBRL0 = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const pad = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje = () => isoDate(new Date());
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const minutos = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const brDate = iso => { const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const brShort = iso => { const [,m,d]=iso.split('-'); return `${d}/${m}`; };
const diaSemana = iso => ['dom','seg','ter','qua','qui','sex','sáb'][new Date(iso+'T12:00:00').getDay()];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const semAcento = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const chave = s => semAcento(s).toLowerCase().trim().replace(/\s+/g,' ');
const parseBRL = s => { s=String(s).replace(/[R$\s.]/g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; };
const uid = () => Math.random().toString(36).slice(2,10);

function slotAtual(now){
  const m = now.getHours()*60+now.getMinutes();
  for(const s of SLOTS) if(m <= minutos(s.limite)) return { slot:s, encerrado:false, falta: minutos(s.limite)-m };
  return { slot:SLOTS[2], encerrado:true, falta:0 };
}
function fmtFalta(min){ if(min<60) return `${min} min`; return `${Math.floor(min/60)}h${pad(min%60)}`; }

/* ---------- dados de demonstração ---------- */
const NOMES_INT = ['Ana Souza','Bruna Lima','Carla Mendes','Diego Ramos','Eduarda Nunes','Felipe Costa','Gabriela Rocha','Henrique Alves','Isabela Freitas','João Pedro Silva','Larissa Moraes','Marcos Vieira','Natália Campos','Otávio Pires','Priscila Duarte'];
const NOMES_PJ = ['Rafael Teixeira','Sabrina Lopes','Thiago Barbosa','Vanessa Cardoso','William Santos','Aline Ferreira','Bianca Correia','Caio Martins','Daniela Ribeiro','Everton Melo','Fernanda Araújo','Gustavo Andrade','Helena Castro','Igor Fonseca','Juliana Batista','Kauã Monteiro','Letícia Prado','Mateus Guimarães','Nicole Azevedo','Paulo Cunha','Renata Oliveira','Samuel Borges','Tatiane Xavier','Vitor Macedo','Yasmin Reis','Lucas Farias','Mariana Tavares','Rodrigo Brito'];

function loginDe(nome){ const p=semAcento(nome).toLowerCase().split(' '); return p[0]+'.'+p[p.length-1]; }
function rng(seed){ let a=seed>>>0; return ()=>{ a+=0x6D2B79F5; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }

function seed(){
  const users = [];
  NOMES_INT.forEach((n,i)=>users.push({ id:'u'+(i+1), nome:n, login:loginDe(n), senha:'1234', tipo:'interno', papel:'vendedor', ativo:true }));
  NOMES_PJ.forEach((n,i)=>users.push({ id:'u'+(i+16), nome:n, login:loginDe(n), senha:'1234', tipo:'pj', papel:'vendedor', ativo:true }));
  users.push({ id:'j1', nome:'Julio Cesar', login:'julio.cesar', senha:'1234', tipo:'interno', papel:'gerente', ativo:true });
  users.push({ id:'v1', nome:'Vitória Ferreira', login:'vitoria.ferreira', senha:'1234', tipo:'interno', papel:'gerente', vende:true, ativo:true });
  users.push({ id:'t0', nome:'Usuário Teste', login:'teste', senha:'teste', senhaOk:true, tipo:'interno', papel:'vendedor', ativo:true });
  users.push({ id:'t1', nome:'Teste Teste', login:'teste.teste', senha:'teste', senhaOk:true, tipo:'interno', papel:'vendedor', ativo:true });
  users.push({ id:'c1', nome:'Douglas Inácio', login:'douglas.inacio', senha:'teste', tipo:'interno', papel:'gerente', vende:false, ativo:true });
  users.push({ id:'g1', nome:'Carlos Henrique', login:'gerente', senha:'1234', tipo:'interno', papel:'coordenador', vende:false, ativo:true });

  // últimos 12 dias úteis + hoje
  const dias=[]; const d=new Date(); d.setHours(12,0,0,0);
  while(dias.length<13){ const wd=d.getDay(); if(wd!==0&&wd!==6) dias.unshift(isoDate(d)); d.setDate(d.getDate()-1); }
  const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
  const envios=[];
  for(const dia of dias){
    const eHoje = dia===hoje();
    for(const u of users){
      if(u.papel!=='vendedor' || u.login==='vitoria.ferreira') continue; // a Vitória começa o dia sem envios (é ela quem apresenta)
      const r = rng(hash(dia+u.id));
      const forca = 0.6 + r()*0.9;          // "peso" do vendedor
      for(const s of SLOTS){
        const lim=minutos(s.limite);
        // cada prÃ©via = o que foi pago naquele perÃ­odo (o total do dia Ã© a soma das 3)
        const novosC = Math.floor(r()*3*forca + (s.n===1?0.6:0.3));
        const contratos = novosC;
        const seguros = Math.min(novosC, Math.floor(r()*2.2));
        const valor = novosC * (1800 + r()*2600) * forca;
        if(eHoje && lim > nowMin){ // prévia ainda aberta hoje: parte já enviou
          if(lim - nowMin > 90 || r() > 0.55) continue;
        }
        if(r() < 0.07) continue;   // esqueceu de enviar
        const atrasado = r() < 0.12;
        const minEnvio = atrasado ? lim + 3 + Math.floor(r()*40) : lim - 5 - Math.floor(r()*70);
        if(eHoje && minEnvio > nowMin) continue;
        envios.push({ id:uid(), userId:u.id, data:dia, previa:s.n, valor:Math.round(valor*100)/100, contratos, seguros,
          hora:`${pad(Math.floor(minEnvio/60))}:${pad(minEnvio%60)}`, atrasado, ts: new Date(dia+'T'+pad(Math.floor(minEnvio/60))+':'+pad(minEnvio%60)+':00').getTime() });
      }
    }
  }
  const db={ users, envios, criadoEm:Date.now() };
  Store.save(db);
  return db;
}

/* ---------- estado ---------- */
let DB = Store.load() || seed();
// garantia da demonstração: a Vitória sempre existe (usuário vitoria.ferreira, senha 1234)
(function(){ { const j=DB.users.find(u=>u.login==='julio'); if(j){ j.login='julio.cesar'; salvar(); } } if(!DB.users.some(u=>u.login==='julio.cesar')){ DB.users.push({ id:'j1', nome:'Julio Cesar', login:'julio.cesar', senha:'1234', tipo:'interno', papel:'gerente', ativo:true }); salvar(); } let v=DB.users.find(u=>u.login==='vitoria.ferreira'); if(!v){ DB.users.push({ id:'v1', nome:'Vitória Ferreira', login:'vitoria.ferreira', senha:'1234', tipo:'interno', papel:'vendedor', ativo:true }); salvar(); } else if(!v.senhaOk){ v.senha='1234'; v.senhaOk=true; v.ativo=true; salvar(); } })();
// perfis: Vitória = admin que envia prévia; chefe = admin; Carlos = coordenador
(function(){ let m=false; const v=DB.users.find(u=>u.login==='vitoria.ferreira'); if(v&&(v.papel!=='gerente'||!v.vende)){ v.papel='gerente'; v.vende=true; m=true; } { const ch=DB.users.find(u=>u.login==='chefe'); if(ch){ ch.login='douglas.inacio'; ch.nome='Douglas Inácio'; ch.senha='teste'; ch.senhaOk=true; ch.papel='gerente'; m=true; } } { if(!DB.users.some(u=>u.login==='teste')){ DB.users.push({ id:'t0', nome:'Usuário Teste', login:'teste', senha:'teste', senhaOk:true, tipo:'interno', papel:'vendedor', ativo:true }); m=true; } } { const t=DB.users.find(u=>u.login==='teste.teste'); if(!t){ DB.users.push({ id:'t1', nome:'Teste Teste', login:'teste.teste', senha:'teste', senhaOk:true, tipo:'interno', papel:'vendedor', ativo:true }); m=true; } else if(t.senha!=='teste'&&!t.senhaOk){ t.senha='teste'; m=true; } } if(!DB.users.some(u=>u.login==='douglas.inacio')){ DB.users.push({ id:'c1', nome:'Douglas Inácio', login:'douglas.inacio', senha:'teste', senhaOk:true, tipo:'interno', papel:'gerente', vende:false, ativo:true }); m=true; } const c=DB.users.find(u=>u.login==='gerente'); if(c&&c.papel==='gerente'&&!c.coordOk){ c.papel='coordenador'; c.vende=false; c.coordOk=true; m=true; } if(m) salvar(); })();
// migração: usuários criados na versão anterior (previa_c6_v1) são preservados
try{ const v1=JSON.parse(localStorage.getItem('previa_c6_v1')||'null'); if(v1&&v1.users){ let add=0; for(const u of v1.users){ if(!DB.users.some(x=>x.login===u.login)){ DB.users.push(u); add++; } } if(add){ salvar(); } localStorage.removeItem('previa_c6_v1'); } }catch(e){}
const S = { user:null, tab:'enviar', dia:hoje(), mes:hoje().slice(0,7), vendSel:null, filtro:'todos', busca:'', previa:null, chartDias:10 };
{ const sid=Store.session(); if(sid) S.user = DB.users.find(u=>u.id===sid) || null; }

function salvar(){ Store.save(DB); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------- consultas ---------- */
const vendedores = () => DB.users.filter(u=>u.ativo!==false&&(u.papel==='vendedor'||u.vende===true)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
const enviosDia = dia => DB.envios.filter(e=>e.data===dia);
function envioDe(uid_, dia, n){ return DB.envios.find(e=>e.userId===uid_&&e.data===dia&&e.previa===n) || null; }
// TOTAL do dia de um vendedor = soma das prÃ©vias enviadas (valor, contratos, seguros); previa/hora = Ãºltima enviada
function totalDe(uid_, dia){ const es=DB.envios.filter(e=>e.userId===uid_&&e.data===dia).sort((a,b)=>a.previa-b.previa); if(!es.length) return null; const u=es[es.length-1]; return { valor:es.reduce((a,e)=>a+e.valor,0), contratos:es.reduce((a,e)=>a+e.contratos,0), seguros:es.reduce((a,e)=>a+e.seguros,0), n:es.length, previa:u.previa, hora:u.hora, atrasado:u.atrasado }; }
const ultimoDe = totalDe;
function slotRef(dia){ // qual prévia é "a da vez" para o dia consultado
  if(dia===hoje()) return slotAtual(new Date()).slot;
  return SLOTS[2];
}
function resumoDia(dia, lista){
  let valor=0,contratos=0,seguros=0,enviaram=0,noPrazo=0; const ref=slotRef(dia);
  const faltam=[];
  for(const u of lista){
    const ult=ultimoDe(u.id,dia); if(ult){ valor+=ult.valor; contratos+=ult.contratos; seguros+=ult.seguros; }
    const e=envioDe(u.id,dia,ref.n); if(e){ enviaram++; if(!e.atrasado) noPrazo++; } else faltam.push(u);
  }
  return { valor,contratos,seguros,enviaram,noPrazo,faltam,ref,total:lista.length };
}
function diasUteisAte(dia, n){ const out=[]; const d=new Date(dia+'T12:00:00'); while(out.length<n){ const wd=d.getDay(); if(wd!==0&&wd!==6) out.unshift(isoDate(d)); d.setDate(d.getDate()-1); } return out; }

/* ---------- render ---------- */
const app = document.getElementById('app');
function render(){
  if(!S.user){ app.innerHTML = viewLogin(); bindLogin(); return; }
  { const ok=abasDe(S.user).map(t=>t[0]); if(!ok.includes(S.tab)) S.tab=ok[0]; }
  app.innerHTML = viewShell() + `<div class="main">${ S.tab==='enviar'?viewEnviar(): S.tab==='painel'?viewPainel(): S.tab==='mes'?viewMes(): S.tab==='acessos'?viewAcessos(): viewGerencia() }</div>`;
  bindShell();
  if(S.tab==='enviar') bindEnviar(); else if(S.tab==='painel') bindPainel(); else if(S.tab==='mes') bindMes(); else if(S.tab==='acessos') bindAcessos(); else bindGerencia();
}

/* ----- login ----- */
function viewLogin(){
  const st=slotAtual(new Date());
  return `<div class="login"><form class="login-card" id="loginForm">
    <div class="brand"><div class="mark">C6</div><div><h1>Prévia C6</h1><small>Prévia diária de pagamentos · equipe comercial</small></div></div>
    <div class="status ${st.encerrado?'closed':''}"><span class="dot"></span>${st.encerrado?'Prévias de hoje encerradas (17:10)':`${st.slot.rotulo} aberta · até ${st.slot.limite} · faltam ${fmtFalta(st.falta)}`}</div>
    <div id="modoEntrar" class="list" style="gap:18px">
      <div class="field"><label for="lg">Usuário</label><input id="lg" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: vitoria.ferreira" required></div>

      <div class="err hide" id="lgErr"></div>

      <button class="btn ghost block" type="button" id="irCriar">Primeiro acesso? Criar meu usuário</button>

    </div>

      <div class="eyebrow">Redefinir senha</div>

      <button class="btn ghost block" type="button" id="irEntrar2">Voltar</button>
    </div>
    <div class="hide">
    </div>
    <div id="modoCriar" class="list hide" style="gap:14px">
      <div class="eyebrow">Primeiro acesso · criar usuário</div>
      <div class="field"><label for="cLogin">Usuário (você vai entrar sempre com ele)</label><input id="cLogin" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex.: vitoria.ferreira"></div>
      <div class="field"><label for="cNome">Seu nome completo</label><input id="cNome" placeholder="ex.: Vitória Ferreira" autocomplete="name"></div>
      <div class="field"><label for="cTipo">Você é</label><select id="cTipo"><option value="interno">Vendedor(a) próprio (interno)</option><option value="pj">Vendedor(a) Corban (terceirizada)</option></select></div>
      <div class="field"><label for="cPw">Senha</label><input id="cPw" type="password" autocomplete="new-password" placeholder="mínimo 4 caracteres"></div>
      <div class="field"><label for="cPw2">Repita a senha</label><input id="cPw2" type="password" autocomplete="new-password"></div>
      <div class="err hide" id="cErr"></div>
      <button class="btn primary block" type="button" id="criar">Criar usuário e entrar</button>
      <button class="btn ghost block" type="button" id="irEntrar">Já tenho usuário · entrar</button>
    </div>
    <div class="demo-hint"><div><b>Demonstração</b> · senha de todos: <b>1234</b> (Douglas, teste e teste.teste: <b>teste</b>). Toque para entrar como:</div>
      <div class="chips"><button type="button" class="chip" data-quick="vitoria.ferreira" style="border-color:var(--ink);font-weight:600">Vitória Ferreira (admin · vende)</button><button type="button" class="chip" data-quick="julio.cesar" style="border-color:var(--ink);font-weight:600">Julio (admin)</button><button type="button" class="chip" data-quick="douglas.inacio" data-pw="teste">Douglas Inácio (admin)</button><button type="button" class="chip" data-quick="ana.souza">Ana Souza (própria)</button><button type="button" class="chip" data-quick="rafael.teixeira">Rafael Teixeira (Corban)</button><button type="button" class="chip" data-quick="gerente">Carlos Henrique (coordenador)</button></div>
      <div class="faint">43 vendedores cadastrados · 15 próprios · 28 Corban</div></div>
  </form></div>`;
}
function normLogin(s){ return semAcento(String(s||'')).toLowerCase().trim().replace(/\s+/g,'.').replace(/[^a-z0-9._-]/g,''); }
function acharUsuario(txt){
  const k=normLogin(txt); if(!k) return null;
  const porLogin=DB.users.find(u=>normLogin(u.login)===k); if(porLogin) return porLogin;
  const porNome=DB.users.find(u=>chave(u.nome)===chave(txt)||normLogin(u.nome)===k); if(porNome) return porNome;
  if(k==='julio') return DB.users.find(u=>u.login==='julio.cesar')||null;
  const primeiro=DB.users.filter(u=>normLogin(u.nome).split('.')[0]===k.split('.')[0]&&k.split('.').length===1); return primeiro.length===1?primeiro[0]:null;
}
function logar(u){ S.user=u; Store.setSession(u.id); S.tab = abasDe(u)[0][0]; render(); }
function bindLogin(){
  const f=document.getElementById('loginForm'); const $=id=>document.getElementById(id);
  const erro=(id,msg)=>{ const el=$(id); el.textContent=msg; el.classList.toggle('hide',!msg); };
  const modo=m=>{ $('modoEntrar').classList.toggle('hide',m!=='entrar'); $('modoCriar').classList.toggle('hide',m!=='criar'); $('modoSenha').classList.toggle('hide',m!=='senha'); };
  const entrar=(lg,pw)=>{
    const u=acharUsuario(lg);
    if(!u){ erro('lgErr',`Usuário "${normLogin(lg)||lg}" não existe. Se é seu primeiro acesso, crie seu usuário abaixo.`); $('cLogin').value=normLogin(lg); return; }
    if(u.ativo===false){ erro('lgErr','Este usuário está desativado. Fale com o gerente.'); return; }
    if(u.senha!==pw){ erro('lgErr','Senha incorreta para o usuário '+u.login+'.'); return; }
    logar(u);
  };
  f.addEventListener('submit',e=>{ e.preventDefault(); entrar($('lg').value,$('pw').value); });
  f.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>entrar(b.dataset.quick,b.dataset.pw||'1234')));
  $('irCriar').onclick=()=>{ modo('criar'); if(!$('cLogin').value) $('cLogin').value=normLogin($('lg').value); $('cLogin').focus(); };
  $('irEntrar').onclick=()=>{ modo('entrar'); $('lg').focus(); };
  $('irEntrar2').onclick=()=>{ modo('entrar'); $('lg').focus(); };
  $('irSenha').onclick=()=>{ modo('senha'); $('sLogin').value=normLogin($('lg').value); ($('sLogin').value?$('sPw'):$('sLogin')).focus(); };
  $('redefinir').onclick=()=>{ const u=acharUsuario($('sLogin').value); const pw=$('sPw').value; if(!u) return erro('sErr',`Usuário "${normLogin($('sLogin').value)}" não existe. Crie seu usuário no primeiro acesso.`); if(pw.length<4) return erro('sErr','A senha precisa ter pelo menos 4 caracteres.'); u.senha=pw; u.senhaOk=true; u.ativo=true; salvar(); toast('Senha redefinida.'); logar(u); };
  $('cNome').addEventListener('input',()=>{ if(!$('cLogin').dataset.tocado) $('cLogin').value=normLogin($('cNome').value.trim().split(/\s+/).filter(Boolean).filter((p,i,a)=>i===0||i===a.length-1).join('.')); });
  $('cLogin').addEventListener('input',()=>{ $('cLogin').dataset.tocado='1'; });
  $('cLogin').addEventListener('blur',()=>{ $('cLogin').value=normLogin($('cLogin').value); });
  $('criar').onclick=()=>{
    const login=normLogin($('cLogin').value);
    const nome=$('cNome').value.replace(/[._\-]+/g,' ').trim().replace(/\s+/g,' ').split(' ').map(p=>p.charAt(0).toUpperCase()+p.slice(1).toLowerCase()).join(' ');
    const pw=$('cPw').value; const pw2=$('cPw2').value;
    if(login.length<3) return erro('cErr','Escolha um usuário (ex.: vitoria.ferreira).');
    if(nome.split(' ').length<2) return erro('cErr','Digite nome e sobrenome (ex.: Vitória Ferreira).');
    if(pw.length<4) return erro('cErr','A senha precisa ter pelo menos 4 caracteres.');
    if(pw!==pw2) return erro('cErr','As senhas não conferem.');
    const ja=DB.users.find(u=>normLogin(u.login)===login);
    if(ja) return erro('cErr',`O usuário "${login}" já existe. Toque em "Já tenho usuário" e entre com a sua senha.`);
    const u={ id:uid(), nome, login, senha:pw, senhaOk:true, tipo:$('cTipo').value, papel:'vendedor', ativo:true };
    DB.users.push(u); salvar(); toast(`Usuário ${login} criado. Bem-vinda, ${nome.split(' ')[0]}!`); logar(u);
  };
}

function bindEnviar(){
  document.getElementById('fEnvio').addEventListener('submit',e=>{
    e.preventDefault(); if(!enviaPrevia(S.user)){ toast('Seu perfil não envia prévia. Ligue "envia prévia" em Acessos.'); return; }
    const valor=parseBRL(v.value); const contratos=Number(document.getElementById('contratos').value||0); const seguros=Number(document.getElementById('seguros').value||0);
    if(seguros>contratos && !confirm('Seguros maior que contratos. Confirma mesmo assim?')) return;
    if(valor===0 && contratos===0 && !confirm('Enviar a prévia zerada (R$ 0,00 e 0 contratos)? Ela entra como zero na soma do dia.')) return;
    const now=new Date(); const sel=SLOTS[S.previa-1]; const atrasado=(now.getHours()*60+now.getMinutes())>minutos(sel.limite);
    const ex=envioDe(S.user.id,hoje(),sel.n);
    if(ex && !podeEditar(ex)){ toast('Esta prévia já não pode ser editada (janela de 2 h).'); return; }
    const reg= ex ? { valor, contratos, seguros, editadoEm:hm(now), ts:Date.now(), ts0:ex.ts0||ex.ts } : { id:uid(), userId:S.user.id, data:hoje(), previa:sel.n, valor, contratos, seguros, hora:hm(now), atrasado, ts:Date.now(), ts0:Date.now() };
    if(ex) Object.assign(ex,reg); else DB.envios.push(reg);
    salvar(); toast(ex?`✓ ${sel.rotulo} corrigida e salva às ${hm(now)}`:`✓ ${sel.rotulo} salva às ${hm(now)}: ${fmtBRL(valor)}${atrasado?' (fora do prazo)':''}`); render();
  });
  document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ S.previa=Number(b.dataset.slot); render(); });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ S.previa=Number(b.dataset.edit); render(); const v2=document.getElementById('valor'); v2.focus(); window.scrollTo({top:0,behavior:'smooth'}); });
  const v=document.getElementById('valor');
  // máscara ao vivo: digita só números, o campo mostra R$ 1.234,56 (os 2 últimos dígitos são centavos)
  const mascara=()=>{ const d=v.value.replace(/[^0-9]/g,'').replace(/^0+(?=[0-9])/,''); v.value = d ? fmtBRL(Number(d)/100) : ''; try{ v.setSelectionRange(v.value.length,v.value.length); }catch(e){} };
  v.addEventListener('input',mascara);
}

function bindPainel(){
  document.getElementById('dia').onchange=e=>{ S.dia=e.target.value||hoje(); render(); };
  document.querySelectorAll('#filtro [data-f]').forEach(b=>b.onclick=()=>{ S.filtro=b.dataset.f; render(); });
  const bs=document.getElementById('busca'); bs.oninput=()=>{ S.busca=bs.value; const pos=bs.selectionStart; render(); const nb=document.getElementById('busca'); nb.focus(); nb.setSelectionRange(pos,pos); };
  document.getElementById('copiarWa').onclick=async()=>{ const t=textoWhats(S.dia,listaFiltrada()); try{ await navigator.clipboard.writeText(t); toast('Resumo copiado. Cole no grupo do WhatsApp.'); }catch(e){ prompt('Copie o texto:',t); } };
}


/* ----- gerência ----- */
function viewGerencia(){
  const dia=S.dia; const lista=vendedores(); const r=resumoDia(dia,lista); const eHoje=dia===hoje();
  const dias=diasUteisAte(dia,S.chartDias);
  const serie=dias.map(d=>{ let int=0,pj=0,c=0,sg=0,n=0; for(const u of lista){ const e=ultimoDe(u.id,d); if(!e) continue; n++; if(u.tipo==='pj') pj+=e.valor; else int+=e.valor; c+=e.contratos; sg+=e.seguros; } return {d,int,pj,tot:int+pj,c,sg,n}; });
  const passados=serie.slice(0,-1).filter(x=>x.tot>0); const media=passados.length?passados.reduce((a,x)=>a+x.tot,0)/passados.length:0;
  const maxV=Math.max(...serie.map(x=>x.tot),1);
  const melhor=serie.reduce((a,x)=>x.tot>(a?a.tot:0)?x:a,null);
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const pont=SLOTS.map(s=>{ let ok=0,tot=0,miss=0; for(const d of dias){ if(d===hoje() && nowMin<minutos(s.limite)) continue; for(const u of lista){ const e=envioDe(u.id,d,s.n); tot++; if(e){ if(!e.atrasado) ok++; } else miss++; } } return {s,ok,tot,miss,late:tot-ok-miss}; });
  const ranking=lista.map(u=>({u,e:ultimoDe(u.id,dia)})).filter(x=>x.e).sort((a,b)=>b.e.valor-a.e.valor);
  const comEnvio=ranking.length; const ticket=r.contratos?r.valor/r.contratos:0; const porVend=comEnvio?r.valor/comEnvio:0;
  const porTipo=['interno','pj'].map(t=>{ const l=lista.filter(u=>u.tipo===t); const rr=resumoDia(dia,l); const ce=l.filter(u=>ultimoDe(u.id,dia)).length; return {t,l,rr,ce}; });
  const ritmo=SLOTS.map(s=>{ let v=0,c=0,sg=0,n=0; for(const u of lista){ const e=envioDe(u.id,dia,s.n); if(e){v+=e.valor;c+=e.contratos;sg+=e.seguros;n++;} } return {s,v,c,sg,n}; });
  const ontem=diasUteisAte(dia,2)[0]; const acumAte=(d,n)=>{ let v=0,c=0,sg=0; for(const u of lista) for(const s of SLOTS){ if(s.n>n) break; const e=envioDe(u.id,d,s.n); if(e){v+=e.valor;c+=e.contratos;sg+=e.seguros;} } return {v,c,sg}; };
  const entregas=SLOTS.map((s,i)=>{ const p=ritmo[i]; const acum=acumAte(dia,s.n); const ont=ontem!==dia?acumAte(ontem,s.n):{v:0,c:0,sg:0}; const hist=dias.filter(d=>d!==dia).map(d=>acumAte(d,s.n).v).filter(v=>v>0); const med=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:0; const encerrada=!eHoje||nowMin>minutos(s.limite); const porTipoAcum=['interno','pj'].map(t=>{ let v=0,c=0; for(const u of lista){ if(u.tipo!==t) continue; for(const x of SLOTS){ if(x.n>s.n) break; const e=envioDe(u.id,dia,x.n); if(e){v+=e.valor;c+=e.contratos;} } } return {t,v,c}; }); return {s,p,acum,ont,med,encerrada,porTipoAcum}; });
  S.__entregas={entregas,dia,lista,ontem};
  const atencao=lista.map(u=>({u,e:ultimoDe(u.id,dia)})).filter(x=>!x.e||x.e.valor===0);
  const atrasos=(()=>{ const m=new Map(); for(const d of dias) for(const u of lista) for(const s of SLOTS){ const e=envioDe(u.id,d,s.n); if(e&&e.atrasado) m.set(u.id,(m.get(u.id)||0)+1); } return [...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,5); })();
  const sel=S.vendSel? DB.users.find(u=>u.id===S.vendSel) : null;
  const hist=sel? dias.map(d=>({d,e:ultimoDe(sel.id,d),es:SLOTS.map(s=>envioDe(sel.id,d,s.n))})) : [];
  const histTot=hist.reduce((a,x)=>a+(x.e?x.e.valor:0),0), histC=hist.reduce((a,x)=>a+(x.e?x.e.contratos:0),0), histS=hist.reduce((a,x)=>a+(x.e?x.e.seguros:0),0);
  const histAtr=hist.reduce((a,x)=>a+x.es.filter(e=>e&&e.atrasado).length,0), histMiss=hist.reduce((a,x)=>a+x.es.filter((e,i)=>!e&&!(x.d===hoje()&&nowMin<minutos(SLOTS[i].limite))).length,0);
  // gráfico
  const W=760,H=220,PL=8,PB=26,PT=18; const bw=(W-PL*2)/serie.length;
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total produzido por dia">
    ${[0.25,0.5,0.75,1].map(f=>`<line class="grid" x1="0" x2="${W}" y1="${PT+(H-PT-PB)*(1-f)}" y2="${PT+(H-PT-PB)*(1-f)}"/>`).join('')}
    ${media?`<line x1="0" x2="${W}" y1="${H-PB-(H-PT-PB)*media/maxV}" y2="${H-PB-(H-PT-PB)*media/maxV}" stroke="var(--muted)" stroke-dasharray="4 4"/>`:''}
    ${serie.map((x,i)=>{ const hInt=(H-PT-PB)*x.int/maxV, hPj=(H-PT-PB)*x.pj/maxV; const x0=PL+i*bw+bw*0.15, w=bw*0.7; const yTop=H-PB-hInt-hPj;
      return `<rect class="bar-pj" x="${x0}" y="${H-PB-hPj}" width="${w}" height="${hPj}" rx="2"/><rect class="bar-int" x="${x0}" y="${H-PB-hPj-hInt}" width="${w}" height="${hInt}" rx="2"/>
      <text class="vl" x="${x0+w/2}" y="${yTop-5}" text-anchor="middle">${x.tot?fmtBRL0(x.tot).replace('R$','').trim():''}</text>
      <text class="lbl" x="${x0+w/2}" y="${H-8}" text-anchor="middle">${brShort(x.d)}${x.d===hoje()?' •':''}</text>`; }).join('')}
  </svg>`;
  const tipoLbl=t=>t==='pj'?'Corban':'Próprios';
  return `<div class="toolbar"><input type="date" id="dia" value="${dia}" max="${hoje()}"><div class="seg" id="cd">${[5,10,13].map(n=>`<button class="${S.chartDias===n?'on':''}" data-n="${n}">${n} dias</button>`).join('')}</div><span class="note">${eHoje?'Hoje, em andamento':'Dia fechado'} · ${comEnvio} de ${lista.length} com envio</span></div>
  <div class="kpis">
    <div class="kpi accent"><div class="eyebrow">Total produzido · ${brShort(dia)}</div><div class="v">${fmtBRL(r.valor)}</div><div class="s">${media?`${r.valor>=media?'▲':'▼'} ${Math.abs(Math.round((r.valor/media-1)*100))}% vs média de ${fmtBRL0(media)} (${passados.length} dias)`:'sem histórico'}</div></div>
    <div class="kpi"><div class="eyebrow">Contratos</div><div class="v">${r.contratos}</div><div class="s">ticket médio ${fmtBRL0(ticket)}</div></div>
    <div class="kpi"><div class="eyebrow">Seguros</div><div class="v">${r.seguros}<span class="muted" style="font-size:14px;font-weight:500"> · ${r.contratos?Math.round(r.seguros/r.contratos*100):0}%</span></div><div class="s">dos contratos saíram com seguro</div></div>
    <div class="kpi"><div class="eyebrow">Média por vendedor</div><div class="v">${fmtBRL0(porVend)}</div><div class="s">entre ${comEnvio} com envio · ${lista.length-comEnvio} sem envio</div></div>
  </div>
  <section class="card entregas">
    <div class="card-h"><div><div class="eyebrow">Entregas do dia · total por horário</div><h2>Evolução de ${diaSemana(dia)} ${brDate(dia)}</h2></div><button class="btn sm primary" data-rep="atual">📋 Copiar reporte do momento</button></div>
    <div class="ent-grid">${entregas.map((x,i)=>{ const dif=x.ont.v?x.acum.v-x.ont.v:null; const pct=x.ont.v?Math.round((x.acum.v/x.ont.v-1)*100):null; const temDados=x.p.n>0||x.acum.v>0; const aberta=eHoje&&!x.encerrada; const st=aberta?`aberta · até ${x.s.limite}`:x.encerrada?`encerrada ${x.s.limite}`:'';
      return `<div class="ent ${aberta?'aberta':''} ${temDados?'':'vazia'}">
        <div class="ent-h"><b>${x.s.rotulo}</b><span class="pill ${aberta?'ok':'neutral'}">${st}</span></div>
        <div class="eyebrow">Acumulado até ${x.s.limite}</div>
        <div class="ent-v">${temDados?fmtBRL(x.acum.v):'—'}</div>
        <div class="ent-sub">${temDados?`${x.acum.c} contratos · ${x.acum.sg} seguros`:aberta?'aguardando envios':'sem envios'}</div>
        <div class="ent-linha"><span>Neste período</span><b>${x.p.n?fmtBRL(x.p.v):'—'}</b></div>
        <div class="ent-linha"><span>Enviaram</span><b>${x.p.n}/${lista.length}${x.p.atr!==undefined?'':''}</b></div>
        <div class="ent-linha"><span>Próprios · Corban</span><b>${fmtBRL0(x.porTipoAcum[0].v)} · ${fmtBRL0(x.porTipoAcum[1].v)}</b></div>
        <div class="ent-linha"><span>Ontem, mesmo horário</span><b>${x.ont.v?fmtBRL0(x.ont.v):'—'}</b></div>
        <div class="ent-cmp ${pct===null?'':pct>=0?'up':'down'}">${pct===null?'sem comparação':`${pct>=0?'▲':'▼'} ${Math.abs(pct)}% (${dif>=0?'+':'−'}${fmtBRL0(Math.abs(dif))}) vs ontem`}${x.med?`<br><span class="faint">média dos últimos dias neste horário: ${fmtBRL0(x.med)}</span>`:''}</div>
        <button class="btn sm ghost block" data-rep="${x.s.n}" ${temDados?'':'disabled'}>📋 Copiar reporte da ${x.s.rotulo}</button>
      </div>`; }).join('')}</div>
    <div class="ent-total"><span>Total do dia${eHoje?' até agora':''}</span><b>${fmtBRL(r.valor)}</b><span class="muted">${r.contratos} contratos · ${r.seguros} seguros · ${comEnvio}/${lista.length} com envio</span></div>
    <p class="note">Acumulado = soma das prévias até aquele horário. O reporte copiado sai em texto pronto para WhatsApp ou e-mail.</p>

  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Total produzido por dia</h2><div class="legend"><span><i></i>Próprios</span><span><i class="pj"></i>Corban</span><span>┅ média</span></div></div>${svg}<p class="note">Valor final do dia (última prévia de cada vendedor). • = hoje.${melhor?` Melhor dia do período: ${brShort(melhor.d)} com ${fmtBRL0(melhor.tot)} e ${melhor.c} contratos.`:''}</p></section>
    <section class="card"><div class="card-h"><h2>Próprios × Corban</h2><span class="muted">${brShort(dia)}</span></div>
      <div class="cmp">${porTipo.map(p=>`<div class="box"><div class="eyebrow">${tipoLbl(p.t)} · ${p.l.length} vendedores</div><div class="big num">${fmtBRL0(p.rr.valor)}</div><div class="note">${p.rr.contratos} contratos · ${p.rr.seguros} seguros · ticket ${fmtBRL0(p.rr.contratos?p.rr.valor/p.rr.contratos:0)}</div><div class="note">média ${fmtBRL0(p.ce?p.rr.valor/p.ce:0)} por vendedor com envio · ${p.rr.enviaram}/${p.l.length} na ${p.rr.ref.rotulo}</div><div class="bar-track" style="margin-top:4px"><div class="bar-fill" style="width:${r.valor?Math.round(p.rr.valor/r.valor*100):0}%"></div></div><div class="note">${r.valor?Math.round(p.rr.valor/r.valor*100):0}% do total do dia</div></div>`).join('')}</div>
    </section>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Pontualidade dos envios</h2><span class="muted">últimos ${dias.length} dias úteis</span></div>
      <div class="bars">${pont.map(p=>`<div class="bar-row"><span>${p.s.rotulo}<br><span class="faint" style="font-size:11px">até ${p.s.limite}</span></span><div><div class="bar-track"><div class="bar-fill" style="width:${p.tot?Math.round(p.ok/p.tot*100):0}%"></div></div><div class="note" style="margin-top:3px">${p.ok} no prazo · ${p.late} atrasados · ${p.miss} sem envio</div></div><b class="num" style="text-align:right">${p.tot?Math.round(p.ok/p.tot*100):0}%</b></div>`).join('')}</div>
      <div style="margin-top:14px" class="list"><div class="eyebrow">Quem mais atrasa no período</div>${atrasos.length?atrasos.map(([id,n])=>{ const u=DB.users.find(x=>x.id===id); return `<div class="row"><span>${esc(u.nome)} <span class="pill ${u.tipo}">${u.tipo==='pj'?'Corban':'Próprio'}</span></span><span class="pill late">${n} atraso${n===1?'':'s'}</span></div>`; }).join(''):'<p class="note">Nenhum atraso no período.</p>'}</div>
    </section>
    <section class="card"><div class="card-h"><h2>Precisam de atenção · ${brShort(dia)}</h2><span class="pill ${atencao.length?'miss':'ok'}">${atencao.length?`${atencao.length} vendedor${atencao.length===1?'':'es'}`:'✓ ninguém'}</span></div>
      ${atencao.length?`<div class="list">${atencao.map(x=>`<div class="row"><span><b>${esc(x.u.nome)}</b> <span class="pill ${x.u.tipo}">${x.u.tipo==='pj'?'Corban':'Próprio'}</span></span><span class="${x.e?'pill late':'pill miss'}">${x.e?`zerado na ${SLOTS[x.e.previa-1].rotulo} (${x.e.hora})`:'nenhuma prévia enviada'}</span></div>`).join('')}</div>`:'<p class="note">Todos os vendedores enviaram prévia com valor no dia.</p>'}
      <p class="note" style="margin-top:10px">Sem envio ou com valor zerado na última prévia. Toque no nome no Painel geral para conferir o histórico.</p>
    </section>
  </div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h2>Ranking do dia</h2><span class="muted">${ranking.length} com envio</span></div>
      <div class="tablewrap"><table style="min-width:0"><thead><tr><th>#</th><th class="name">Vendedor</th><th class="r">Produzido</th><th class="r">Contr.</th><th class="r">Seg.</th><th class="r">% do dia</th></tr></thead>
      <tbody>${ranking.slice(0,10).map((x,i)=>`<tr><td class="rank">${i+1}</td><td class="name"><b>${esc(x.u.nome)}</b><span class="sub">${x.u.tipo==='pj'?'Corban':'Próprio'}</span></td><td class="r"><span class="val">${fmtBRL(x.e.valor)}</span></td><td class="r tnum">${x.e.contratos}</td><td class="r tnum">${x.e.seguros}</td><td class="r tnum">${r.valor?(x.e.valor/r.valor*100).toFixed(1).replace('.',','):'0'}%</td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td class="name">Top 10</td><td class="r"><span class="val">${fmtBRL(ranking.slice(0,10).reduce((a,x)=>a+x.e.valor,0))}</span></td><td class="r tnum">${ranking.slice(0,10).reduce((a,x)=>a+x.e.contratos,0)}</td><td class="r tnum">${ranking.slice(0,10).reduce((a,x)=>a+x.e.seguros,0)}</td><td class="r tnum">${r.valor?Math.round(ranking.slice(0,10).reduce((a,x)=>a+x.e.valor,0)/r.valor*100):0}%</td></tr></tfoot></table></div>
    </section>
    <section class="card"><div class="card-h"><h2>Detalhe por vendedor</h2><select id="vendSel" style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:14px"><option value="">Escolha um vendedor…</option>${lista.map(u=>`<option value="${u.id}" ${sel&&sel.id===u.id?'selected':''}>${esc(u.nome)} (${u.tipo==='pj'?'Corban':'Próprio'})</option>`).join('')}</select></div>

      :`<p class="note">Escolha um vendedor para ver o histórico dia a dia, com horário de cada prévia, atrasos e total do período.</p>`}
    </section>

function reporteTexto(n){
  const E=S.__entregas; if(!E) return ''; const {entregas,dia,lista}=E; const eHoje=dia===hoje(); const nowMin=new Date().getHours()*60+new Date().getMinutes();
  let x = n==='atual' ? [...entregas].reverse().find(e=>e.p.n>0) || entregas[0] : entregas[n-1];
  const linhas=[];
  linhas.push(`*PRÉVIA DE PAGAMENTOS · ${brDate(dia)} (${diaSemana(dia)})*`);
  linhas.push(`${x.s.rotulo} · ${x.encerrada?'fechada às '+x.s.limite:'parcial, '+hm(new Date())}`);
  linhas.push('');
  linhas.push(`*Acumulado do dia: ${fmtBRL(x.acum.v)}*`);
  linhas.push(`Contratos: ${x.acum.c} · Seguros: ${x.acum.sg}`);
  linhas.push(`Neste período: ${fmtBRL(x.p.v)} (${x.p.c} contratos)`);
  linhas.push(`Próprios: ${fmtBRL(x.porTipoAcum[0].v)} (${x.porTipoAcum[0].c} contr.) · Corban: ${fmtBRL(x.porTipoAcum[1].v)} (${x.porTipoAcum[1].c} contr.)`);
  linhas.push(`Enviaram: ${x.p.n}/${lista.length}`);
  const evol=entregas.filter(e=>e.s.n<=x.s.n).map(e=>`${e.s.n}ª ${e.s.limite} ${fmtBRL0(e.acum.v)}`).join(' → ');
  linhas.push(`Evolução: ${evol}`);
  if(x.ont.v){ const pct=Math.round((x.acum.v/x.ont.v-1)*100); linhas.push(`Ontem no mesmo horário: ${fmtBRL0(x.ont.v)} (${pct>=0?'+':''}${pct}%)`); }
  if(x.med) linhas.push(`Média dos últimos dias neste horário: ${fmtBRL0(x.med)}`);
  const faltam=lista.filter(u=>!envioDe(u.id,dia,x.s.n)); if(faltam.length&&faltam.length<=8) linhas.push(`Sem envio na ${x.s.rotulo}: ${faltam.map(u=>u.nome).join(', ')}`); else if(faltam.length) linhas.push(`Sem envio na ${x.s.rotulo}: ${faltam.length} vendedores`);
  return linhas.join('\n');
}
function bindGerencia(){
  document.querySelectorAll('[data-rep]').forEach(b=>b.onclick=async()=>{ const t=reporteTexto(b.dataset.rep==='atual'?'atual':Number(b.dataset.rep)); try{ await navigator.clipboard.writeText(t); toast('Reporte copiado. Cole no WhatsApp ou e-mail.'); }catch(e){ prompt('Copie o texto:',t); } });
  document.getElementById('dia').onchange=e=>{ S.dia=e.target.value||hoje(); render(); };
  document.querySelectorAll('#cd [data-n]').forEach(b=>b.onclick=()=>{ S.chartDias=Number(b.dataset.n); render(); });
  document.getElementById('vendSel').onchange=e=>{ S.vendSel=e.target.value||null; render(); };
}
/* ----- acessos (admin): usuários, perfis e liberação ----- */
const ehAdmin = u => !!u && u.papel==='gerente';
const enviaPrevia = u => !!u && u.ativo!==false && (u.papel==='vendedor' || u.vende===true);
function papelLbl(u){ const b=u.papel==='gerente'?'Admin':u.papel==='coordenador'?'Coordenador(a)':'Vendedor(a)'; return u.papel!=='vendedor'&&u.vende?b+' · envia prévia':b; }
function ctrlUsuario(u){
  const eu=u.id===S.user.id;
  return `<div class="uctl">

function bindAcessos(){
  const $=id=>document.getElementById(id);

  $('fUser').addEventListener('submit',e=>{ e.preventDefault(); const erro=m=>{ $('uErr').textContent=m; $('uErr').classList.toggle('hide',!m); };

  });
}

function diasUteisDoMes(ym){ const [Y,M]=ym.split('-').map(Number); const out=[]; const d=new Date(Y,M-1,1); while(d.getMonth()===M-1){ const wd=d.getDay(); if(wd!==0&&wd!==6) out.push(isoDate(d)); d.setDate(d.getDate()+1); } return out; }
function dadosMes(ym, lista){
  const dias=diasUteisDoMes(ym); const ids=new Set(lista.map(u=>u.id));
  const linhas=dias.map(dia=>{ const ps=SLOTS.map(s=>{ let v=0,c=0,sg=0,n=0,atr=0; for(const u of lista){ const e=envioDe(u.id,dia,s.n); if(e){ v+=e.valor;c+=e.contratos;sg+=e.seguros;n++; if(e.atrasado) atr++; } } return {v,c,sg,n,atr}; });
    const tot=ps.reduce((a,p)=>({v:a.v+p.v,c:a.c+p.c,sg:a.sg+p.sg,n:a.n+p.n,atr:a.atr+p.atr}),{v:0,c:0,sg:0,n:0,atr:0});
    const env=new Set(DB.envios.filter(e=>e.data===dia&&ids.has(e.userId)).map(e=>e.userId)).size; return {dia,ps,tot,env}; });
  const comDados=linhas.filter(l=>l.env>0);
  const T=linhas.reduce((a,l)=>({v:a.v+l.tot.v,c:a.c+l.tot.c,sg:a.sg+l.tot.sg,n:a.n+l.tot.n,atr:a.atr+l.tot.atr}),{v:0,c:0,sg:0,n:0,atr:0});
  const porV=lista.map(u=>{ const es=DB.envios.filter(e=>e.userId===u.id&&e.data.startsWith(ym)); return {u,v:es.reduce((a,e)=>a+e.valor,0),c:es.reduce((a,e)=>a+e.contratos,0),sg:es.reduce((a,e)=>a+e.seguros,0),dias:new Set(es.map(e=>e.data)).size,atr:es.filter(e=>e.atrasado).length,n:es.length}; }).sort((a,b)=>b.v-a.v);
  return {dias,linhas,comDados,T,porV};
}

  const rows=D.linhas.filter(l=>l.env).map(l=>[brDate(l.dia),...l.ps.map(p=>num(p.v)),num(l.tot.v),l.tot.c,l.tot.sg,l.env]);
  const l2=['Vendedor','Tipo','Total no mês','Contratos','Seguros','Dias com envio','Atrasos'];
  const rows2=D.porV.map(x=>[x.u.nome,x.u.tipo==='pj'?'Corban':'Próprio',num(x.v),x.c,x.sg,x.dias,x.atr]);
  return [l1.join(sep),...rows.map(r=>r.join(sep)),'',l2.join(sep),...rows2.map(r=>r.join(sep))].join('\n');
}
function bindMes(){
  document.getElementById('mes').onchange=e=>{ S.mes=e.target.value||hoje().slice(0,7); render(); };
  document.querySelectorAll('#filtro [data-f]').forEach(b=>b.onclick=()=>{ S.filtro=b.dataset.f; render(); });
  const bs=document.getElementById('busca'); bs.oninput=()=>{ S.busca=bs.value; const pos=bs.selectionStart; render(); const nb=document.getElementById('busca'); nb.focus(); nb.setSelectionRange(pos,pos); };
  document.getElementById('copiarCsv').onclick=async()=>{ const t=csvMes(); try{ await navigator.clipboard.writeText(t); toast('Planilha copiada. Cole no Excel ou no Google Planilhas.'); }catch(e){ prompt('Copie o texto:',t); } };
}

render();
// atualização automática: confere a versão publicada e recarrega se mudou (evita ficar com cópia velha no celular)
(async function(){ try{ if(location.protocol==='file:') return; const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); const t=await r.text(); const m=t.match(/APP_VERSION = '([^']+)'/); if(m&&m[1]!==APP_VERSION){ toast('Nova versão disponível, atualizando…'); setTimeout(()=>location.reload(),900); } }catch(e){} })();
setInterval(()=>{ if(S.user && document.visibilityState==='visible') { const st=document.querySelector('.top .status span:last-child'); if(st){ const s=slotAtual(new Date()); st.textContent = s.encerrado?'Prévias de hoje encerradas':`${s.slot.rotulo} · até ${s.slot.limite} · faltam ${fmtFalta(s.falta)}`; } } }, 30000);
